name: main jdk17 build

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Accorder au token le droit de commenter pour afficher le Rick Roll
    permissions:
      contents: read
      pull-requests: write
      issues: write
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Install external tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libimage-exiftool-perl
      - name: Build with Maven
        run: mvn clean apache-rat:check test install javadoc:aggregate -Pci -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
      # Étape d'analyse Semgrep corrigée
      - name: Analyse de sécurité Semgrep
        uses: semgrep/action@v1
        with:
          config: "p/java, p/findsecbugs" # AJOUT : Les deux paquets sont nécessaires !
        env:
          # Pour comparer avec le commit précédent et détecter UNIQUEMENT les nouvelles failles
          SEMGREP_BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      
      # Étape pour exécuter le Rick Roll en cas d'échec
      - name: Rick Roll en cas d'échec
        if: failure()
        uses: TejasvOnly/random-rickroll@v1.0
        with:
          percentage: 100 # Forcé à 100% pour que la blague marche à chaque coup
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
    e2e-tests:
      runs-on: ubuntu-latest
      timeout-minutes: 30
      needs: build
      strategy:
        matrix:
          java: [ '17' ]

      steps:
        - uses: actions/checkout@v6
        - name: Set up JDK ${{ matrix.java }}
          uses: actions/setup-java@v5
          with:
            distribution: 'temurin'
            java-version: ${{ matrix.java }}
            cache: 'maven'
        - name: Run E2E Tests
          run: mvn -pl tika-e2e-tests -am clean verify -Pe2e -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
