name: main jdk17 build

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      issues: write
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      
      - name: Install external tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libimage-exiftool-perl
      
      - name: Analyse de sécurité Semgrep
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" -w /src semgrep/semgrep \
          semgrep scan \
          --config "p/java" \
          --config "p/findsecbugs" \
          --config ".semgrep" \
          --baseline-commit "${{ github.event.pull_request.base.sha }}" \
          --error
      
      - name: Rick Roll en cas d'échec
        if: failure()
        uses: TejasvOnly/random-rickroll@v1.0
        with:
          percentage: 100
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}